<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>AI小站 · 小游戏 & 实用工具</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/background.css" />
</head>
<body>
    <!-- 气球气泡背景 -->
    <div class="balloon-container">
        <div class="balloon balloon-1"></div>
        <div class="balloon balloon-2"></div>
        <div class="balloon balloon-3"></div>
        <div class="balloon balloon-4"></div>
        <div class="balloon balloon-5"></div>
        <div class="balloon balloon-6"></div>
        <div class="balloon balloon-7"></div>
        <div class="balloon balloon-8"></div>
    </div>

    <!-- 气泡背景 -->
    <div class="bubble-container">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
        <div class="bubble bubble-6"></div>
        <div class="bubble bubble-7"></div>
        <div class="bubble bubble-8"></div>
        <div class="bubble bubble-9"></div>
        <div class="bubble bubble-10"></div>
    </div>

    <div id="landing-page" class="page page-active">
        <div class="landing-container">
            <div class="landing-hero">
                <div class="landing-title">AI小站</div>
                <div class="landing-subtitle">即点即玩 · 多场景娱乐</div>
            </div>

            <!-- 小游戏模块 -->
            <div class="landing-section">
                <div class="landing-section-title">🎮 小游戏</div>
                <div class="landing-grid">
                    <a href="gomoku-home.html" class="landing-square landing-square-gomoku">
                        <div class="landing-square-icon">
                            <span class="landing-piece landing-piece-black"></span>
                            <span class="landing-piece landing-piece-white"></span>
                        </div>
                        <div class="landing-square-name">五子棋</div>
                    </a>

                    <a href="go.html" class="landing-square landing-square-go">
                        <div class="landing-square-icon">
                            <span class="landing-go-dot landing-go-dot-black"></span>
                            <span class="landing-go-dot landing-go-dot-white"></span>
                        </div>
                        <div class="landing-square-name">围棋</div>
                    </a>

                    <a href="sheep-simple.html" class="landing-square landing-square-sheep-simple">
                        <div class="landing-square-icon">🐑</div>
                        <div class="landing-square-name">羊了个羊<br/><small>简单版</small></div>
                    </a>

                    <a href="sheep.html" class="landing-square landing-square-sheep-challenge">
                        <div class="landing-square-icon">🏆</div>
                        <div class="landing-square-name">羊了个羊<br/><small>挑战版</small></div>
                    </a>
                </div>
            </div>

            <!-- 实用工具模块 -->
            <div class="landing-section">
                <div class="landing-section-title">🔧 实用工具</div>
                <div class="landing-grid landing-grid-single">
                    <a href="football.html" class="landing-square landing-square-football">
                        <div class="landing-square-icon">
                            <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#1a3d6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polygon points="12,2 15,6.5 12,11 9,6.5"></polygon>
                                <polygon points="2,10 6.5,8.5 7,12.5 3,13.5"></polygon>
                                <polygon points="22,10 17.5,8.5 17,12.5 21,13.5"></polygon>
                                <polygon points="6,17 10,17 12,21 8,19.5"></polygon>
                                <polygon points="18,17 14,17 12,21 16,19.5"></polygon>
                            </svg>
                        </div>
                        <div class="landing-square-name">足球竞猜</div>
                    </a>

                    <a href="calculator.html" class="landing-square landing-square-calculator">
                        <div class="landing-square-icon">🧮</div>
                        <div class="landing-square-name">计算器</div>
                    </a>
                </div>
            </div>

            <div class="landing-footer">
                <span>点击图标进入对应功能</span>
            </div>
        </div>
    </div>

    <script src="js/background-manager.js"></script>
    <script>
        // 等待DOM加载完成后再初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM加载完成，开始初始化气球和气泡交互效果');
            
            // 气球悬停/触摸处理
            function handleBalloonHover(e) {
                e.stopPropagation();
                e.preventDefault();
                
                var balloon = e.currentTarget;
                
                // 防止重复触发
                if (balloon.dataset.popping === 'true') return;
                balloon.dataset.popping = 'true';
                
                console.log('气球被触碰');
                
                // 停止动画
                balloon.style.animation = 'none';
                
                // 放大
                balloon.style.transform = 'scale(1.3)';
                
                // 延迟破碎
                setTimeout(function() {
                    balloon.classList.add('pop');
                    
                    // 创建碎片
                    var rect = balloon.getBoundingClientRect();
                    var cx = rect.left + rect.width / 2;
                    var cy = rect.top + rect.height / 2;
                    
                    for (var i = 0; i < 8; i++) {
                        var frag = document.createElement('div');
                        frag.className = 'balloon-fragment';
                        frag.style.left = cx + 'px';
                        frag.style.top = cy + 'px';
                        
                        var angle = Math.random() * Math.PI * 2;
                        var dist = Math.random() * 100 + 50;
                        var ex = Math.cos(angle) * dist;
                        var ey = Math.sin(angle) * dist + 50;
                        
                        frag.style.setProperty('--end-x', ex + 'px');
                        frag.style.setProperty('--end-y', ey + 'px');
                        
                        document.body.appendChild(frag);
                        setTimeout(function() { frag.remove(); }, 600);
                    }
                    
                    // 重置
                    setTimeout(function() {
                        balloon.style.transform = '';
                        balloon.style.animation = '';
                        balloon.classList.remove('pop');
                        balloon.dataset.popping = 'false';
                    }, 400);
                }, 300);
            }
            
            // 气泡悬停/触摸处理
            function handleBubbleHover(e) {
                e.stopPropagation();
                e.preventDefault();
                
                var bubble = e.currentTarget;
                
                // 防止重复触发
                if (bubble.dataset.popping === 'true') return;
                bubble.dataset.popping = 'true';
                
                console.log('气泡被触碰');
                
                // 停止动画
                bubble.style.animation = 'none';
                
                // 破裂
                bubble.classList.add('pop');
                
                // 创建粒子
                var rect = bubble.getBoundingClientRect();
                var cx = rect.left + rect.width / 2;
                var cy = rect.top + rect.height / 2;
                
                for (var i = 0; i < 10; i++) {
                    var part = document.createElement('div');
                    part.className = 'bubble-particle';
                    part.style.left = cx + 'px';
                    part.style.top = cy + 'px';
                    
                    var angle = Math.random() * Math.PI * 2;
                    var dist = Math.random() * 60 + 30;
                    var ex = Math.cos(angle) * dist;
                    var ey = Math.sin(angle) * dist;
                    
                    part.style.setProperty('--end-x', ex + 'px');
                    part.style.setProperty('--end-y', ey + 'px');
                    
                    document.body.appendChild(part);
                    setTimeout(function() { part.remove(); }, 400);
                }
                
                // 重置
                setTimeout(function() {
                    bubble.style.animation = '';
                    bubble.classList.remove('pop');
                    bubble.dataset.popping = 'false';
                }, 300);
            }
            
            // 初始化
            var balloons = document.querySelectorAll('.balloon');
            var bubbles = document.querySelectorAll('.bubble');
            
            console.log('找到气球: ' + balloons.length + '个');
            console.log('找到气泡: ' + bubbles.length + '个');
            
            if (balloons.length === 0) {
                console.error('没有找到气球元素！');
            }
            
            if (bubbles.length === 0) {
                console.error('没有找到气泡元素！');
            }
            
            // 气球事件：鼠标悬停和触摸触发
            for (var i = 0; i < balloons.length; i++) {
                balloons[i].dataset.popping = 'false';
                
                // 电脑端：鼠标悬停触发
                balloons[i].addEventListener('mouseenter', handleBalloonHover);
                
                // 移动端：触摸触发（使用pointerenter兼容）
                balloons[i].addEventListener('pointerenter', function(e) {
                    if (e.pointerType === 'touch') {
                        handleBalloonHover(e);
                    }
                });
                
                console.log('已为气球 ' + (i + 1) + ' 添加悬停/触摸事件监听器');
            }
            
            // 气泡事件：鼠标悬停和触摸触发
            for (var i = 0; i < bubbles.length; i++) {
                bubbles[i].dataset.popping = 'false';
                
                // 电脑端：鼠标悬停触发
                bubbles[i].addEventListener('mouseenter', handleBubbleHover);
                
                // 移动端：触摸触发（使用pointerenter兼容）
                bubbles[i].addEventListener('pointerenter', function(e) {
                    if (e.pointerType === 'touch') {
                        handleBubbleHover(e);
                    }
                });
                
                console.log('已为气泡 ' + (i + 1) + ' 添加悬停/触摸事件监听器');
            }
            
            console.log('气球和气泡交互初始化完成');
        });
    </script>
</body>
</html>
