<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>桌上足球 - AI小站</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/foosball.css" />
</head>
<body>
    <div class="foosball-page">
        <!-- 游戏头部 -->
        <header class="game-header">
            <a href="index.html" class="back-link">← 返回</a>
            <h1 class="game-title">⚽ 桌上足球</h1>
            <div class="header-actions">
                <button class="sound-btn" id="soundBtn" title="音效开关">🔊</button>
            </div>
        </header>

        <!-- 比分板 -->
        <div class="scoreboard">
            <div class="score-team score-team-left">
                <div class="team-name">我的队伍</div>
                <div class="formation-display" id="formation1">-</div>
                <div class="team-score" id="score1">0</div>
            </div>
            <div class="score-center">
                <div class="game-timer" id="gameTimer">00:00</div>
                <div class="score-vs">VS</div>
            </div>
            <div class="score-team score-team-right">
                <div class="team-score" id="score2">0</div>
                <div class="formation-display" id="formation2">-</div>
                <div class="team-name">AI队伍</div>
            </div>
        </div>

        <!-- 游戏画布 -->
        <div class="game-canvas-container" id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            
            <!-- 开始界面 -->
            <div class="game-overlay" id="gameOverlay">
                <div class="overlay-content">
                    <div class="overlay-title">⚽ 桌上足球</div>
                    <div class="overlay-subtitle">人机对战 · 11人制</div>
                    
                    <div class="formation-select">
                        <div class="formation-label">选择你的阵容:</div>
                        <div class="formation-options">
                            <button class="formation-btn active" data-formation="442">4-4-2</button>
                            <button class="formation-btn" data-formation="4231">4-2-3-1</button>
                            <button class="formation-btn" data-formation="433">4-3-3</button>
                            <button class="formation-btn" data-formation="4132">4-1-3-2</button>
                        </div>
                    </div>

                    <div class="duration-select">
                        <div class="duration-label">比赛时长:</div>
                        <div class="duration-options">
                            <select id="durationSelect">
                                <option value="1">1分钟</option>
                                <option value="3" selected>3分钟</option>
                                <option value="5">5分钟</option>
                            </select>
                        </div>
                    </div>

                    <button class="start-btn" id="startBtn">开始比赛</button>
                    
                    <div class="controls-info">
                        <div class="control-row">
                            <span class="control-label">⏱️ 比赛时长:</span>
                            <span class="control-keys">可选1/3/5分钟（均显示90分钟）</span>
                        </div>
                        <div class="control-row">
                            <span class="control-label">⌨️ 电脑端:</span>
                            <span class="control-keys">W/S 或 ↑↓ 移动球员杆</span>
                        </div>
                        <div class="control-row">
                            <span class="control-label">📱 移动端:</span>
                            <span class="control-keys">上下滑动控制</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 进球提示 -->
            <div class="goal-overlay" id="goalOverlay">
                <div class="goal-text">⚽ GOAL!</div>
            </div>
        </div>

        <!-- 控制栏 -->
        <div class="control-bar">
            <button class="control-btn" id="pauseBtn">⏸️ 暂停</button>
            <button class="control-btn" id="restartBtn">🔄 重新开始</button>
            <div class="difficulty-select">
                <span>AI难度:</span>
                <select id="difficultyLevel">
                    <option value="easy">简单</option>
                    <option value="medium" selected>中等</option>
                    <option value="hard">困难</option>
                </select>
            </div>
        </div>

        <!-- 移动端触控区域 -->
        <div class="touch-controls" id="touchControls" style="display: none;">
            <div class="touch-area touch-area-up" id="touchUp">▲</div>
            <div class="touch-area touch-area-down" id="touchDown">▼</div>
        </div>
    </div>

    <script src="js/foosball.js"></script>
</body>
</html>
