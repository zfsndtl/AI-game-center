<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气球气泡交互测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .test-title {
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        /* 气球样式 */
        .test-balloon {
            width: 80px;
            height: 100px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 182, 193, 0.9), rgba(255, 105, 180, 0.6), rgba(255, 20, 147, 0.4));
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.4);
            cursor: pointer;
            margin: 20px auto;
            display: inline-block;
            position: relative;
        }
        
        .test-balloon.pop {
            animation: balloonPop 0.4s ease forwards;
        }
        
        @keyframes balloonPop {
            0% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        /* 气泡样式 */
        .test-bubble {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.4) 50%, rgba(255, 255, 255, 0.2) 100%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            margin: 20px auto;
            display: inline-block;
        }
        
        .test-bubble.pop {
            animation: bubblePop 0.3s ease forwards;
        }
        
        @keyframes bubblePop {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        /* 碎片和粒子 */
        .balloon-fragment {
            position: fixed;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.8);
            pointer-events: none;
            z-index: 9999;
            animation: fragmentFly 0.6s ease-out forwards;
        }
        
        @keyframes fragmentFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--end-x), var(--end-y)) scale(0.3); opacity: 0; }
        }
        
        .bubble-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 9999;
            animation: particleFly 0.4s ease-out forwards;
        }
        
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--end-x), var(--end-y)) scale(0.2); opacity: 0; }
        }
        
        .log {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .log-item {
            margin: 5px 0;
            padding: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>气球气泡交互测试</h1>
        
        <div class="test-section">
            <div class="test-title">气球点击测试（点击后放大破碎）</div>
            <div class="test-balloon" id="balloon"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">气泡点击测试（点击立即破裂）</div>
            <div class="test-bubble" id="bubble"></div>
        </div>
        
        <div class="log" id="log">
            <div style="margin-bottom: 10px;">事件日志：</div>
        </div>
    </div>
    
    <script>
        console.log('测试页面加载完成');
        
        // 日志函数
        function log(msg) {
            console.log(msg);
            var logDiv = document.getElementById('log');
            var item = document.createElement('div');
            item.className = 'log-item';
            item.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            logDiv.appendChild(item);
        }
        
        // 气球点击
        document.getElementById('balloon').addEventListener('click', function(e) {
            e.preventDefault();
            log('气球被点击');
            
            var balloon = this;
            
            // 放大
            balloon.style.transform = 'scale(1.3)';
            log('气球放大');
            
            // 延迟破碎
            setTimeout(function() {
                balloon.classList.add('pop');
                log('气球破碎');
                
                // 创建碎片
                var rect = balloon.getBoundingClientRect();
                var cx = rect.left + rect.width / 2;
                var cy = rect.top + rect.height / 2;
                
                for (var i = 0; i < 8; i++) {
                    var frag = document.createElement('div');
                    frag.className = 'balloon-fragment';
                    frag.style.left = cx + 'px';
                    frag.style.top = cy + 'px';
                    
                    var angle = Math.random() * Math.PI * 2;
                    var dist = Math.random() * 100 + 50;
                    var ex = Math.cos(angle) * dist;
                    var ey = Math.sin(angle) * dist + 50;
                    
                    frag.style.setProperty('--end-x', ex + 'px');
                    frag.style.setProperty('--end-y', ey + 'px');
                    
                    document.body.appendChild(frag);
                    
                    setTimeout(function() { frag.remove(); }, 600);
                }
                
                log('创建8个碎片');
                
                // 重置
                setTimeout(function() {
                    balloon.style.transform = '';
                    balloon.classList.remove('pop');
                    log('气球重置');
                }, 400);
            }, 300);
        });
        
        // 气泡点击
        document.getElementById('bubble').addEventListener('click', function(e) {
            e.preventDefault();
            log('气泡被点击');
            
            var bubble = this;
            
            // 破裂
            bubble.classList.add('pop');
            log('气泡破裂');
            
            // 创建粒子
            var rect = bubble.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            
            for (var i = 0; i < 10; i++) {
                var part = document.createElement('div');
                part.className = 'bubble-particle';
                part.style.left = cx + 'px';
                part.style.top = cy + 'px';
                
                var angle = Math.random() * Math.PI * 2;
                var dist = Math.random() * 60 + 30;
                var ex = Math.cos(angle) * dist;
                var ey = Math.sin(angle) * dist;
                
                part.style.setProperty('--end-x', ex + 'px');
                part.style.setProperty('--end-y', ey + 'px');
                
                document.body.appendChild(part);
                
                setTimeout(function() { part.remove(); }, 400);
            }
            
            log('创建10个粒子');
            
            // 重置
            setTimeout(function() {
                bubble.classList.remove('pop');
                log('气泡重置');
            }, 300);
        });
        
        log('页面初始化完成，请点击气球或气泡');
    </script>
</body>
</html>
