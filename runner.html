<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>下班跑酷 - AI小站</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/runner.css" />
</head>
<body>
    <div class="runner-page">
        <!-- 游戏头部 -->
        <header class="runner-header">
            <a href="index.html" class="back-link">← 返回</a>
            <h1 class="page-title">🏃 下班跑酷</h1>
            <div class="header-stats">
                <span class="coin-count" id="coinCount">💰 0</span>
            </div>
        </header>

        <!-- 游戏信息栏 -->
        <div class="game-info-bar">
            <div class="info-item">
                <span class="info-label">关卡</span>
                <span class="info-value" id="levelNum">1</span>
            </div>
            <div class="info-item">
                <span class="info-label">距离</span>
                <span class="info-value"><span id="distance">0</span>m</span>
            </div>
            <div class="info-item">
                <span class="info-label">已过</span>
                <span class="info-value"><span id="passedBuildings">0</span>栋</span>
            </div>
            <div class="info-item">
                <span class="info-label">目标</span>
                <span class="info-value"><span id="targetDistance">100</span>m</span>
            </div>
        </div>

        <!-- 游戏画布 -->
        <div class="game-container" id="gameContainer">
            <canvas id="gameCanvas"></canvas>

            <!-- 开始界面 -->
            <div class="game-overlay" id="gameOverlay">
                <div class="overlay-content">
                    <div class="overlay-icon">🏃‍♂️</div>
                    <div class="overlay-title">下班跑酷</div>
                    <div class="overlay-subtitle">逃离办公室，奔向自由！</div>

                    <div class="level-select" id="levelSelect">
                        <div class="level-title">选择关卡</div>
                        <div class="level-grid" id="levelGrid"></div>
                    </div>

                    <div class="control-tips">
                        <div class="tip-item">
                            <span class="tip-icon">⌨️</span>
                            <span class="tip-text">电脑端：A/D 或 ←→ 左右移动，空格跳跃</span>
                        </div>
                        <div class="tip-item">
                            <span class="tip-icon">📱</span>
                            <span class="tip-text">移动端：左右滑动移动，点击跳跃</span>
                        </div>
                    </div>

                    <button class="start-btn" id="startBtn">开始奔跑</button>
                </div>
            </div>

            <!-- 游戏结束界面 -->
            <div class="result-overlay" id="resultOverlay" style="display: none;">
                <div class="result-content">
                    <div class="result-icon" id="resultIcon">🏃</div>
                    <div class="result-title" id="resultTitle">加油！</div>
                    <div class="result-stats">
                        <div class="stat-item">
                            <span class="stat-label">奔跑距离</span>
                            <span class="stat-value" id="finalDistance">0</span>m
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">收集金币</span>
                            <span class="stat-value" id="finalCoins">0</span>💰
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">最高记录</span>
                            <span class="stat-value" id="bestDistance">0</span>m
                        </div>
                    </div>
                    <div class="result-buttons">
                        <button class="result-btn retry-btn" id="retryBtn">🔄 再来一次</button>
                        <button class="result-btn next-btn" id="nextBtn" style="display: none;">➡️ 下一关</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 移动端控制 -->
        <div class="mobile-controls" id="mobileControls" style="display: none;">
            <button class="control-left" id="controlLeft">◀</button>
            <button class="control-jump" id="controlJump">⬆</button>
            <button class="control-right" id="controlRight">▶</button>
        </div>
    </div>

    <script src="js/runner.js"></script>
</body>
</html>
