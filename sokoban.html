<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>推箱子 - AI小站</title>
    <link rel="stylesheet" href="css/background.css" />
    <link rel="stylesheet" href="css/sokoban.css" />
</head>
<body>
    <!-- 气球气泡背景 -->
    <div class="balloon-container">
        <div class="balloon balloon-1"></div>
        <div class="balloon balloon-2"></div>
        <div class="balloon balloon-3"></div>
        <div class="balloon balloon-4"></div>
    </div>
    <div class="bubble-container">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
    </div>

    <div class="sokoban-page">
        <div class="sokoban-header">
            <a href="index.html" class="back-btn">← 返回</a>
            <h1 class="sokoban-title">📦 推箱子</h1>
            <div class="header-spacer"></div>
        </div>

        <div class="sokoban-info">
            <div class="info-item">
                <span class="info-label">关卡</span>
                <span class="info-value" id="levelDisplay">1 / 10</span>
            </div>
            <div class="info-item">
                <span class="info-label">步数</span>
                <span class="info-value" id="stepsDisplay">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">推数</span>
                <span class="info-value" id="pushesDisplay">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">用时</span>
                <span class="info-value" id="timeDisplay">0:00</span>
            </div>
            <div class="info-item">
                <span class="info-label">总用时</span>
                <span class="info-value" id="totalTimeDisplay">0:00</span>
            </div>
        </div>

        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="controls">
            <div class="control-row">
                <button class="control-btn" id="undoBtn" title="撤销">↶</button>
                <button class="control-btn" id="resetBtn" title="重置">🔄</button>
            </div>
            <div class="direction-pad">
                <button class="dir-btn dir-up" id="upBtn">↑</button>
                <div class="dir-middle">
                    <button class="dir-btn dir-left" id="leftBtn">←</button>
                    <div class="dir-center"></div>
                    <button class="dir-btn dir-right" id="rightBtn">→</button>
                </div>
                <button class="dir-btn dir-down" id="downBtn">↓</button>
            </div>
        </div>

        <div class="level-nav">
            <button class="nav-btn" id="prevLevelBtn" disabled>上一关</button>
            <button class="nav-btn" id="nextLevelBtn">下一关</button>
        </div>

        <!-- 过关弹窗 -->
        <div class="modal-overlay" id="winModal" style="display:none;">
            <div class="win-modal">
                <div class="win-icon">🎉</div>
                <div class="win-title">恭喜过关！</div>
                <div class="win-stats">
                    <div class="win-stat">
                        <span class="win-stat-label">步数</span>
                        <span class="win-stat-value" id="winSteps">0</span>
                    </div>
                    <div class="win-stat">
                        <span class="win-stat-label">推数</span>
                        <span class="win-stat-value" id="winPushes">0</span>
                    </div>
                    <div class="win-stat">
                        <span class="win-stat-label">用时</span>
                        <span class="win-stat-value" id="winTime">0:00</span>
                    </div>
                    <div class="win-stat">
                        <span class="win-stat-label">总用时</span>
                        <span class="win-stat-value" id="winTotalTime">0:00</span>
                    </div>
                </div>
                <div class="win-buttons">
                    <button class="win-btn" id="replayBtn">再玩一次</button>
                    <button class="win-btn win-btn-primary" id="nextLevelWinBtn">下一关</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/background-manager.js"></script>
    <script src="js/sokoban.js"></script>
</body>
</html>
