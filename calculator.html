<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>计算器</title>
    <link rel="stylesheet" href="css/calculator.css" />
    <link rel="stylesheet" href="css/background.css" />
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-header">
            <a href="index.html" class="calculator-back-btn">← 返回首页</a>
            <div class="calculator-title">计算器</div>
            <button class="calculator-mode-toggle" id="modeToggle" title="切换科学计算器">SCI</button>
        </div>

        <div class="calculator-display">
            <div class="calculator-angle-mode" id="angleMode">
                <button class="calculator-angle-btn active" data-angle="deg">DEG</button>
                <button class="calculator-angle-btn" data-angle="rad">RAD</button>
            </div>
            <div class="calculator-expression" id="expression"></div>
            <div class="calculator-result" id="result">0</div>
        </div>

        <!-- 科学函数面板 -->
        <div class="calculator-scientific" id="scientificPanel">
            <div class="calculator-row">
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="sin">sin</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="cos">cos</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="tan">tan</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="log">log</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="ln">ln</button>
            </div>
            <div class="calculator-row">
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="asin">sin⁻¹</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="acos">cos⁻¹</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="atan">tan⁻¹</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="sqrt">√x</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="abs">|x|</button>
            </div>
            <div class="calculator-row">
                <button class="calculator-btn calculator-btn-sci" data-action="power" data-value="2">x²</button>
                <button class="calculator-btn calculator-btn-sci" data-action="power" data-value="3">x³</button>
                <button class="calculator-btn calculator-btn-sci" data-action="power" data-value="n">xⁿ</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="exp">eˣ</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="tenx">10ˣ</button>
            </div>
            <div class="calculator-row">
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="inv">1/x</button>
                <button class="calculator-btn calculator-btn-sci" data-action="func" data-value="fact">x!</button>
                <button class="calculator-btn calculator-btn-sci" data-action="constant" data-value="pi">π</button>
                <button class="calculator-btn calculator-btn-sci" data-action="constant" data-value="e">e</button>
                <button class="calculator-btn calculator-btn-sci" data-action="paren" data-value="(">(</button>
            </div>
        </div>

        <div class="calculator-buttons">
            <div class="calculator-row">
                <button class="calculator-btn calculator-btn-clear" data-action="clear">C</button>
                <button class="calculator-btn calculator-btn-delete" data-action="delete">⌫</button>
                <button class="calculator-btn calculator-btn-operator" data-action="operator" data-value="%">%</button>
                <button class="calculator-btn calculator-btn-operator" data-action="operator" data-value="/">÷</button>
            </div>
            <div class="calculator-row">
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value="7">7</button>
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value="8">8</button>
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value="9">9</button>
                <button class="calculator-btn calculator-btn-operator" data-action="operator" data-value="*">×</button>
            </div>
            <div class="calculator-row">
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value="4">4</button>
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value="5">5</button>
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value="6">6</button>
                <button class="calculator-btn calculator-btn-operator" data-action="operator" data-value="-">−</button>
            </div>
            <div class="calculator-row">
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value="1">1</button>
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value="2">2</button>
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value="3">3</button>
                <button class="calculator-btn calculator-btn-operator" data-action="operator" data-value="+">+</button>
            </div>
            <div class="calculator-row">
                <button class="calculator-btn calculator-btn-number calculator-btn-wide" data-action="number" data-value="0">0</button>
                <button class="calculator-btn calculator-btn-number" data-action="number" data-value=".">.</button>
                <button class="calculator-btn calculator-btn-equals" data-action="equals">=</button>
            </div>
        </div>
    </div>

    <script src="js/background-manager.js"></script>
    <script src="js/calculator.js"></script>
</body>
</html>
