<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>五子棋</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- 模式选择页 -->
    <div id="home-page" class="page page-active">
        <div class="page-container">
            <div class="page-header">
                <a href="index.html" class="back-btn">← 返回首页</a>
                <div class="page-title">五子棋</div>
            </div>
            <div class="mode-select-grid">
                <button class="mode-square mode-square-pvp mode-btn" data-mode="pvp">
                    <div class="mode-square-icon">👥</div>
                    <div class="mode-square-name">双人本地对战</div>
                    <div class="mode-square-desc">同一设备轮流落子</div>
                </button>
                <button class="mode-square mode-square-pve mode-btn" data-mode="pve">
                    <div class="mode-square-icon">🤖</div>
                    <div class="mode-square-name">人机对战</div>
                    <div class="mode-square-desc">挑战智能AI</div>
                </button>
            </div>
        </div>
    </div>
    <!-- 创建房间页 -->
    <div id="room-page" class="page">
        <div class="page-container">
            <div class="page-header">
                <a href="#" class="back-btn" data-back="home">← 返回</a>
                <div class="page-title">房间已创建</div>
            </div>
            <div class="room-container">
                <div class="room-card">
                    <div class="room-label">房间号</div>
                    <div class="room-code-display" id="room-code-display">0000</div>
                    <button class="room-copy-btn" id="copy-code-btn">
                        <span class="mode-title">复制房间号</span>
                    </button>
                </div>
                <div class="room-status" id="room-status">
                    <div class="status-icon">⏳</div>
                    <div class="status-text">等待对手加入...</div>
                </div>
                <div class="room-tip" id="room-tip">把房间号发给好友，或在另一个浏览器标签页输入同样房间号即可开始对战</div>
            </div>
        </div>
    </div>

    <!-- 加入房间页 -->
    <div id="join-page" class="page">
        <div class="page-container">
            <div class="page-header">
                <a href="#" class="back-btn" data-back="home">← 返回</a>
                <div class="page-title">加入房间</div>
            </div>
            <div class="join-container">
                <div class="join-label">请输入 4 位房间号</div>
                <div class="code-input-row" id="code-input-row">
                    <input type="tel" maxlength="1" class="code-digit" />
                    <input type="tel" maxlength="1" class="code-digit" />
                    <input type="tel" maxlength="1" class="code-digit" />
                    <input type="tel" maxlength="1" class="code-digit" />
                </div>
                <button class="join-confirm-btn" id="confirm-join-btn">
                    <span class="mode-title">加入对局</span>
                </button>
                <div class="join-status" id="join-status" style="display:none;">
                    <div class="status-icon">⏳</div>
                    <div class="status-text">正在搜索房间...</div>
                </div>
            </div>
        </div>
    </div>
    <!-- 游戏页 -->
    <div id="game-page" class="page">
        <div class="game-container">
            <div class="game-header">
                <button class="game-back-btn" id="back-btn" data-back="home">← 返回</button>
                <div class="game-mode" id="game-mode-label">双人对战</div>
                <div class="game-header-spacer"></div>
            </div>

            <div class="my-color-banner" id="my-color-banner" style="display:none;">
                <span class="my-color-indicator" id="my-color-indicator"></span>
                <span class="my-color-text" id="my-color-text">你执黑</span>
            </div>

            <div class="player-info">
                <div class="player player-black" id="player-black">
                    <div class="player-avatar">⚫</div>
                    <div class="player-name" id="player-black-name">玩家 1</div>
                </div>
                <div class="turn-indicator">
                    <div class="turn-piece" id="turn-piece">⚫</div>
                    <div class="turn-text" id="turn-text">黑棋落子</div>
                </div>
                <div class="player player-white" id="player-white">
                    <div class="player-avatar">⚪</div>
                    <div class="player-name" id="player-white-name">玩家 2</div>
                </div>
            </div>

            <div class="board" id="board">
                <div class="board-lines" id="board-lines"></div>
                <div class="board-overlay" id="board-overlay"></div>
                <div class="board-pieces" id="board-pieces"></div>
            </div>

            <div class="game-actions">
                <button class="game-btn game-btn-secondary" id="undo-btn">↶ 悔棋</button>
                <button class="game-btn game-btn-secondary" id="restart-btn">↻ 重开</button>
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div class="result-modal" id="result-modal" style="display:none;">
        <div class="result-modal-overlay"></div>
        <div class="result-modal-box">
            <div class="result-piece" id="result-piece">⚫</div>
            <div class="result-title" id="result-title">黑棋获胜</div>
            <div class="result-subtitle" id="result-subtitle">恭喜！</div>
            <div class="result-actions">
                <button class="result-btn" id="modal-restart-btn">再来一局</button>
                <button class="result-btn result-btn-ghost" id="modal-home-btn">返回首页</button>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
