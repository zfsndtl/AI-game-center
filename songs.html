<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>歌曲列表</title>
    <link rel="stylesheet" href="css/songs.css" />
    <link rel="stylesheet" href="css/background.css" />
</head>
<body>
    <div class="songs-container">
        <div class="songs-header">
            <a href="index.html" class="songs-back-btn">← 返回首页</a>
            <div class="songs-title">歌曲列表</div>
        </div>

        <!-- 添加歌曲按钮 -->
        <div class="add-song-bar">
            <button class="add-song-btn" id="addSongBtn">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                添加歌曲
            </button>
        </div>

        <!-- 歌曲列表 -->
        <div class="song-list" id="songList">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">🎶</div>
                <div class="empty-text">暂无歌曲</div>
                <div class="empty-hint">点击上方按钮添加歌曲</div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑歌曲弹窗 -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">添加歌曲</span>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">歌曲名称 *</label>
                    <input type="text" class="form-input" id="songNameInput" placeholder="请输入歌曲名称" />
                </div>
                <div class="form-group">
                    <label class="form-label">歌手</label>
                    <input type="text" class="form-input" id="songArtistInput" placeholder="请输入歌手名称" />
                </div>
                <div class="form-group">
                    <label class="form-label">歌词 *</label>
                    <textarea class="form-textarea" id="songLyricsInput" placeholder="请输入歌词，每行一句&#10;例如：&#10;天青色等烟雨&#10;而我在等你&#10;炊烟袅袅升起&#10;隔江千万里" rows="10"></textarea>
                    <div class="form-hint">每行作为一句歌词，可在详情页为每句歌词添加录音</div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">取消</button>
                <button class="modal-btn modal-btn-save" id="modalSaveBtn">保存</button>
            </div>
        </div>
    </div>

    <script src="js/background-manager.js"></script>
    <script src="js/songs.js"></script>
</body>
</html>
