<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>音乐播放器</title>
    <link rel="stylesheet" href="css/music-player.css" />
    <link rel="stylesheet" href="css/background.css" />
</head>
<body>
    <div class="player-container">
        <div class="player-header">
            <a href="index.html" class="player-back-btn">← 返回首页</a>
            <div class="player-title">音乐播放器</div>
        </div>

        <!-- 黑胶唱片区域 -->
        <div class="vinyl-stage">
            <!-- 唱臂 -->
            <div class="tonearm" id="tonearm">
                <div class="tonearm-pivot"></div>
                <div class="tonearm-arm">
                    <div class="tonearm-head"></div>
                </div>
            </div>
            <!-- 唱片 -->
            <div class="vinyl-record" id="vinylRecord">
                <div class="vinyl-groove vinyl-groove-1"></div>
                <div class="vinyl-groove vinyl-groove-2"></div>
                <div class="vinyl-groove vinyl-groove-3"></div>
                <div class="vinyl-groove vinyl-groove-4"></div>
                <div class="vinyl-groove vinyl-groove-5"></div>
                <div class="vinyl-label" id="vinylLabel">
                    <div class="vinyl-label-text" id="vinylLabelText">🎵</div>
                </div>
                <div class="vinyl-center"></div>
            </div>
        </div>

        <!-- 歌曲信息 -->
        <div class="song-info">
            <div class="song-name" id="songName">未选择歌曲</div>
            <div class="song-status" id="songStatus">请选择本地音乐文件</div>
        </div>

        <!-- 进度条 -->
        <div class="progress-section">
            <span class="progress-time" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-thumb" id="progressThumb"></div>
            </div>
            <span class="progress-time" id="totalTime">0:00</span>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="ctrl-btn ctrl-prev" id="prevBtn" title="上一首">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="ctrl-btn ctrl-play" id="playBtn" title="播放/暂停">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="ctrl-btn ctrl-next" id="nextBtn" title="下一首">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>

        <!-- 音量 -->
        <div class="volume-section">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="rgba(255,255,255,0.6)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" />
        </div>

        <!-- 文件选择 -->
        <div class="file-section">
            <button class="file-btn" id="selectFilesBtn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                选择音乐文件
            </button>
            <button class="file-btn file-btn-folder" id="selectFolderBtn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                选择目录
            </button>
            <input type="file" id="fileInput" accept="audio/*" multiple style="display:none;" />
            <input type="file" id="folderInput" webkitdirectory multiple style="display:none;" />
        </div>

        <!-- 播放列表 -->
        <div class="playlist-section" id="playlistSection" style="display:none;">
            <div class="playlist-header">
                <span class="playlist-title">播放列表</span>
                <span class="playlist-count" id="playlistCount">0 首</span>
            </div>
            <div class="playlist" id="playlist"></div>
        </div>
    </div>

    <script src="js/background-manager.js"></script>
    <script src="js/music-player.js"></script>
</body>
</html>
